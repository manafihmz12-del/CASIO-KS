<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO>KS | Accessoires Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --gold: #FFD700;
            --dark: #0a0a0a;
            --dark2: #111111;
            --dark3: #1a1a1a;
            --dark4: #222222;
            --white: #ffffff;
            --gray: #888888;
            --danger: #ff4444;
            --whatsapp: #25D366;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; }

        /* ── HEADER ── */
        header {
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            border-bottom: 2px solid var(--gold);
            padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(255,215,0,0.15);
        }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 2rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; text-shadow: 0 0 20px rgba(255,215,0,0.5); }
        .logo span { color: var(--white); }
        .tagline { font-size: 0.7rem; color: var(--gray); letter-spacing: 3px; text-transform: uppercase; }
        .social-header a { color: var(--gray); font-size: 1.3rem; margin-left: 15px; transition: color 0.3s; text-decoration: none; }
        .social-header a:hover { color: var(--gold); }

        /* ── HERO ── */
        .hero {
            background: linear-gradient(135deg, #0a0a0a, #111, #0a0a0a);
            padding: 70px 20px; text-align: center; position: relative; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, rgba(255,215,0,0.06) 0%, transparent 70%);
        }
        .hero h1 { font-size: 3rem; font-weight: 800; color: var(--gold); margin-bottom: 12px; text-shadow: 0 0 30px rgba(255,215,0,0.3); }
        .hero p { color: var(--gray); font-size: 1rem; max-width: 480px; margin: 0 auto; line-height: 1.7; }

        /* ── PRODUCTS ── */
        .products-section { padding: 50px 20px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 1.4rem; font-weight: 700; margin-bottom: 40px; color: var(--gold); }
        .section-title::after { content: ''; display: block; width: 60px; height: 3px; background: var(--gold); margin: 10px auto 0; border-radius: 2px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 25px; }

        /* ── CARD ── */
        .product-card {
            background: var(--dark3); border-radius: 18px; overflow: hidden;
            border: 1px solid rgba(255,215,0,0.1);
            transition: transform 0.35s, box-shadow 0.35s, border-color 0.35s;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.5); }
        .product-img { width: 100%; height: 230px; object-fit: cover; display: block; }
        .product-img-placeholder { width: 100%; height: 230px; background: var(--dark4); display: flex; align-items: center; justify-content: center; color: #333; font-size: 3.5rem; }
        .product-info { padding: 20px; }
        .product-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 7px; }
        .product-desc { font-size: 0.82rem; color: var(--gray); margin-bottom: 12px; line-height: 1.6; }
        .product-price { font-size: 1.35rem; font-weight: 800; color: var(--gold); margin-bottom: 18px; }
        .product-actions { display: flex; gap: 10px; }
        .btn-whatsapp {
            flex: 1; background: var(--whatsapp); color: white; border: none;
            padding: 12px; border-radius: 12px; font-family: 'Poppins', sans-serif;
            font-weight: 600; font-size: 0.9rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: opacity 0.3s, transform 0.2s; text-decoration: none;
        }
        .btn-whatsapp:hover { opacity: 0.88; transform: scale(1.02); }
        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white; border: none; padding: 12px 15px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: opacity 0.3s, transform 0.2s; text-decoration: none;
        }
        .btn-instagram:hover { opacity: 0.88; transform: scale(1.05); }

        /* ── EMPTY STATE ── */
        .empty-state { text-align: center; padding: 80px 20px; color: var(--gray); grid-column: 1 / -1; }
        .empty-state i { font-size: 4rem; margin-bottom: 20px; color: #2a2a2a; display: block; }

        /* ── ADMIN TRIGGER ── */
        .admin-trigger {
            position: fixed; bottom: 25px; right: 25px;
            background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.3);
            color: var(--gold); width: 52px; height: 52px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem; transition: all 0.3s; z-index: 200;
        }
        .admin-trigger:hover { background: var(--gold); color: var(--dark); }

        /* ── MODALS ── */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88); z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--dark3); border-radius: 22px; padding: 40px;
            width: 100%; max-width: 460px;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 25px 70px rgba(0,0,0,0.6);
            animation: slideUp 0.3s ease;
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal h2 { font-size: 1.5rem; color: var(--gold); margin-bottom: 28px; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.83rem; color: var(--gray); margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group textarea {
            width: 100%; background: var(--dark4); border: 1px solid rgba(255,255,255,0.08);
            color: var(--white); padding: 13px 16px; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem;
            transition: border-color 0.3s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--gold); }
        .form-group textarea { resize: vertical; min-height: 85px; }
        .btn-primary {
            width: 100%; background: var(--gold); color: var(--dark); border: none;
            padding: 14px; border-radius: 12px; font-family: 'Poppins', sans-serif;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            transition: opacity 0.3s; margin-top: 8px;
        }
        .btn-primary:hover { opacity: 0.88; }
        .btn-cancel {
            width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.12);
            color: var(--gray); padding: 12px; border-radius: 12px;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem;
            cursor: pointer; margin-top: 10px; transition: all 0.3s;
        }
        .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }
        .error-msg { color: var(--danger); font-size: 0.82rem; text-align: center; margin-top: 8px; display: none; }

        /* ── ADMIN PANEL (Sidebar) ── */
        .admin-panel {
            display: none; position: fixed; top: 0; right: 0;
            width: 100%; max-width: 380px; height: 100vh;
            background: var(--dark3); border-left: 2px solid rgba(255,215,0,0.15);
            z-index: 500; overflow-y: auto; padding: 28px 20px;
            box-shadow: -15px 0 50px rgba(0,0,0,0.6);
            animation: slideInRight 0.3s ease;
        }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .admin-panel.active { display: block; }
        .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
        .panel-header h2 { color: var(--gold); font-size: 1.2rem; }
        .close-panel { background: none; border: none; color: var(--gray); cursor: pointer; font-size: 1.3rem; }
        .close-panel:hover { color: var(--danger); }
        .btn-add-product {
            background: var(--gold); color: var(--dark); border: none;
            padding: 13px 20px; border-radius: 12px; font-family: 'Poppins', sans-serif;
            font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 22px;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem;
        }
        .admin-product-item {
            background: var(--dark4); border-radius: 12px; padding: 14px;
            margin-bottom: 12px; display: flex; align-items: center; gap: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .admin-product-img { width: 58px; height: 58px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--dark3); }
        .admin-product-info { flex: 1; min-width: 0; }
        .admin-product-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-product-price { font-size: 0.78rem; color: var(--gold); margin-top: 3px; }
        .btn-delete {
            background: rgba(255,68,68,0.12); border: 1px solid rgba(255,68,68,0.3);
            color: var(--danger); width: 36px; height: 36px; border-radius: 9px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.3s;
        }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* ── FOOTER ── */
        footer { text-align: center; padding: 45px 20px; border-top: 1px solid rgba(255,215,0,0.08); color: var(--gray); font-size: 0.83rem; }
        footer .gold { color: var(--gold); font-weight: 600; }
        .footer-socials { margin-top: 15px; display: flex; justify-content: center; gap: 20px; }
        .footer-socials a { font-size: 1.6rem; text-decoration: none; transition: transform 0.3s; }
        .footer-socials a:hover { transform: scale(1.2); }

        /* ── RESPONSIVE ── */
        @media (max-width: 580px) {
            .hero h1 { font-size: 2rem; }
            .logo { font-size: 1.5rem; }
            .admin-panel { max-width: 100%; }
        }
    </style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header>
    <div class="header-content">
        <div>
            <div class="logo">CASIO<span>></span>KS</div>
            <div class="tagline">Accessoires Premium</div>
        </div>
        <div class="social-header">
            <a class="wa-link" href="#" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a class="ig-link" href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
    </div>
</header>

<!-- ══════════ HERO ══════════ -->
<div class="hero">
    <h1>✦ CASIO&gt;KS ✦</h1>
    <p>Découvrez notre collection exclusive d'accessoires premium — Style, Qualité &amp; Élégance.</p>
</div>

<!-- ══════════ PRODUCTS ══════════ -->
<div class="products-section">
    <div class="section-title">🛍️ Nos Produits</div>
    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- ══════════ FOOTER ══════════ -->
<footer>
    <p>© 2024 <span class="gold">CASIO&gt;KS</span> — Tous droits réservés</p>
    <div class="footer-socials">
        <a class="wa-link" href="#" target="_blank" style="color:#25D366;"><i class="fab fa-whatsapp"></i></a>
        <a class="ig-link" href="#" target="_blank" style="color:#e1306c;"><i class="fab fa-instagram"></i></a>
    </div>
</footer>

<!-- ══════════ ADMIN BUTTON ══════════ -->
<button class="admin-trigger" onclick="showPasswordModal()" title="Admin">
    <i class="fas fa-lock"></i>
</button>

<!-- ══════════ PASSWORD MODAL ══════════ -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal">
        <h2><i class="fas fa-shield-alt"></i> &nbsp;Admin Access</h2>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="passwordInput" placeholder="••••••••••"
                   onkeypress="if(event.key==='Enter') checkPassword()">
        </div>
        <p class="error-msg" id="passwordError">❌ Mot de passe incorrect !</p>
        <button class="btn-primary" onclick="checkPassword()"><i class="fas fa-unlock"></i> &nbsp;Accéder</button>
        <button class="btn-cancel" onclick="closeModal('passwordModal')">Annuler</button>
    </div>
</div>

<!-- ══════════ ADD PRODUCT MODAL ══════════ -->
<div class="modal-overlay" id="addProductModal">
    <div class="modal">
        <h2><i class="fas fa-plus-circle"></i> &nbsp;Ajouter un Produit</h2>
        <div class="form-group">
            <label>Nom du produit *</label>
            <input type="text" id="pName" placeholder="Ex: Montre Casio Gold">
        </div>
        <div class="form-group">
            <label>Prix *</label>
            <input type="text" id="pPrice" placeholder="Ex: 350 DH">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="pDesc" placeholder="Décrivez le produit..."></textarea>
        </div>
        <div class="form-group">
            <label>Lien Image (URL)</label>
            <input type="text" id="pImage" placeholder="https://...">
        </div>
        <button class="btn-primary" onclick="addProduct()"><i class="fas fa-check"></i> &nbsp;Ajouter</button>
        <button class="btn-cancel" onclick="closeModal('addProductModal')">Annuler</button>
    </div>
</div>

<!-- ══════════ ADMIN SIDEBAR ══════════ -->
<div class="admin-panel" id="adminPanel">
    <div class="panel-header">
        <h2>⚙️ &nbsp;Admin Panel</h2>
        <button class="close-panel" onclick="closeAdminPanel()"><i class="fas fa-times"></i></button>
    </div>
    <button class="btn-add-product" onclick="showAddModal()">
        <i class="fas fa-plus"></i> Ajouter un Produit
    </button>
    <div id="adminList"></div>
</div>

<script>
/* ════════════════════════════════════════
   ⚙️  CONFIGURATION  — Modifiez ici !
════════════════════════════════════════ */
const CONFIG = {
    password:       "2026",          // ← Mot de passe admin
    whatsappNumber: "212689060737",          // ← Votre numéro (sans + ni espaces)
    instagramURL:   "https://www.instagram.com/mo_unafi/"  // ← Votre Instagram
};

/* ════ DATA ════ */
let products = JSON.parse(localStorage.getItem('casioks_products')) || [
    {
        id: 1,
        name: "Montre Casio Classic",
        price: "350 DH",
        desc: "Montre authentique, style classique et intemporel.",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=300&fit=crop"
    },
    {
        id: 2,
        name: "Bracelet Cuir Premium",
        price: "120 DH",
        desc: "Bracelet en cuir véritable, finition luxe.",
        image: "https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400&h=300&fit=crop"
    },
    {
        id: 3,
        name: "Lunettes de Soleil",
        price: "200 DH",
        desc: "Protection UV400, design moderne et élégant.",
        image: "https://images.unsplash.com/photo-1508296695146-257a814070b4?w=400&h=300&fit=crop"
    }
];

/* ════ RENDER PRODUCTS ════ */
function renderProducts() {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';

    if (!products.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-box-open"></i>
                <p>Aucun produit disponible pour le moment.</p>
                <p style="font-size:0.8rem;margin-top:6px;color:#444">Revenez bientôt ! 🌟</p>
            </div>`;
        return;
    }

    products.forEach(p => {
        const msg = encodeURIComponent(`Salam 👋 Bghi norder: *${p.name}* — ${p.price} 🛍️`);
        const imgHTML = p.image
            ? `<img class="product-img" src="${p.image}" alt="${p.name}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
               <div class="product-img-placeholder" style="display:none;"><i class="fas fa-image"></i></div>`
            : `<div class="product-img-placeholder"><i class="fas fa-image"></i></div>`;

        grid.innerHTML += `
            <div class="product-card">
                ${imgHTML}
                <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    ${p.desc ? `<div class="product-desc">${p.desc}</div>` : ''}
                    <div class="product-price">${p.price}</div>
                    <div class="product-actions">
                        <a class="btn-whatsapp"
                           href="https://wa.me/${CONFIG.whatsappNumber}?text=${msg}"
                           target="_blank">
                            <i class="fab fa-whatsapp"></i> Commander
                        </a>
                        <a class="btn-instagram" href="${CONFIG.instagramURL}" target="_blank">
                            <i class="fab fa-instagram"></i>
                        </a>
                    </div>
                </div>
            </div>`;
    });
}

/* ════ ADMIN LIST ════ */
function renderAdminList() {
    const list = document.getElementById('adminList');
    if (!products.length) {
        list.innerHTML = '<p style="color:#555;text-align:center;font-size:0.85rem;">Aucun produit ajouté.</p>';
        return;
    }
    list.innerHTML = products.map(p => `
        <div class="admin-product-item">
            ${p.image
                ? `<img class="admin-product-img" src="${p.image}"
                        onerror="this.style.background='#1a1a1a'">`
                : `<div class="admin-product-img" style="background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#333">
                       <i class="fas fa-image"></i></div>`
            }
            <div class="admin-product-info">
                <div class="admin-product-name">${p.name}</div>
                <div class="admin-product-price">${p.price}</div>
            </div>
            <button class="btn-delete" onclick="deleteProduct(${p.id})">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    `).join('');
}

function save() { localStorage.setItem('casioks_products', JSON.stringify(products)); }

/* ════ ADD PRODUCT ════ */
function addProduct() {
    const name  = document.getElementById('pName').value.trim();
    const price = document.getElementById('pPrice').value.trim();
    const desc  = document.getElementById('pDesc').value.trim();
    const image = document.getElementById('pImage').value.trim();

    if (!name || !price) { alert('⚠️ Mantouj o prix khasshoum !'); return; }

    products.push({ id: Date.now(), name, price, desc, image });
    save();
    renderProducts();
    renderAdminList();
    closeModal('addProductModal');
    ['pName','pPrice','pDesc','pImage'].forEach(id => document.getElementById(id).value = '');
}

/* ════ DELETE PRODUCT ════ */
function deleteProduct(id) {
    if (!confirm('Wach bdak tmhi had l-mantouj?')) return;
    products = products.filter(p => p.id !== id);
    save();
    renderProducts();
    renderAdminList();
}

/* ════ AUTH ════ */
function showPasswordModal() {
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordError').style.display = 'none';
    document.getElementById('passwordModal').classList.add('active');
    setTimeout(() => document.getElementById('passwordInput').focus(), 150);
}

function checkPassword() {
    if (document.getElementById('passwordInput').value === CONFIG.password) {
        closeModal('passwordModal');
        renderAdminList();
        document.getElementById('adminPanel').classList.add('active');
    } else {
        document.getElementById('passwordError').style.display = 'block';
        document.getElementById('passwordInput').value = '';
    }
}

function closeAdminPanel() { document.getElementById('adminPanel').classList.remove('active'); }
function showAddModal()    { document.getElementById('addProductModal').classList.add('active'); }
function closeModal(id)    { document.getElementById(id).classList.remove('active'); }

/* ════ SOCIAL LINKS ════ */
function updateSocials() {
    document.querySelectorAll('.wa-link').forEach(a =>
        a.href = `https://wa.me/${CONFIG.whatsappNumber}`);
    document.querySelectorAll('.ig-link').forEach(a =>
        a.href = CONFIG.instagramURL);
}

/* ════ CLOSE ON OVERLAY CLICK ════ */
document.querySelectorAll('.modal-overlay').forEach(el =>
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('active'); })
);

/* ════ INIT ════ */
renderProducts();
updateSocials();
</script>
</body>
</html>
